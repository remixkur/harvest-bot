name: Check Cloudflare worker

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"
  pull_request:
    paths:
      - "cloudflare/**"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - run: npm install
      - run: npm run check
