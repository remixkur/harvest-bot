name: Deploy bot to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TELEGRAM_BOT_TOKEN"

      - run: npm install
      - run: npm run check

      - name: Create or locate D1 database
        run: |
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=rows.find(x=>x.name==="harvest-youth-bot");if(db)process.stdout.write(db.uuid||db.id)')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create harvest-youth-bot --json > /tmp/d1-create.json
            DB_ID=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1-create.json","utf8"));process.stdout.write(x.uuid||x.id||x.database_id)')
          fi
          test -n "$DB_ID"
          node -e 'const fs=require("fs");const p="wrangler.toml";const id=process.argv[1];fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("REPLACE_WITH_D1_DATABASE_ID",id))' "$DB_ID"

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply harvest-youth-bot --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Configure Worker and Telegram secrets
        run: |
          WEBHOOK_SECRET=$(openssl rand -hex 32)
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Register Telegram webhook
        run: |
          node - <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const webhookSecret = process.env.WEBHOOK_SECRET;

          const cf = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`,
            { headers: { Authorization: `Bearer ${apiToken}` } }
          );
          const cfBody = await cf.json();
          if (!cf.ok || !cfBody.success || !cfBody.result?.subdomain) {
            throw new Error(`Cannot obtain workers.dev subdomain: ${JSON.stringify(cfBody)}`);
          }

          const workerUrl = `https://harvest-youth-bot.${cfBody.result.subdomain}.workers.dev`;
          const health = await fetch(workerUrl);
          if (!health.ok) {
            throw new Error(`Worker health check failed: ${health.status}`);
          }

          const telegram = await fetch(
            `https://api.telegram.org/bot${botToken}/setWebhook`,
            {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                url: `${workerUrl}/webhook`,
                secret_token: webhookSecret,
                allowed_updates: ["message", "callback_query"],
                drop_pending_updates: true
              })
            }
          );
          const telegramBody = await telegram.json();
          if (!telegram.ok || !telegramBody.ok) {
            throw new Error(`setWebhook failed: ${JSON.stringify(telegramBody)}`);
          }

          console.log(`Cloudflare Worker is live at ${workerUrl}`);
          NODE
